<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="description" content="Track your money across GCash, GoTyme, Maribank, and Landbank." />
    <title>FinTrack — Finance Tracker</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.svg" />
    <link rel="stylesheet" href="style.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />
</head>

<body>

    <!-- Toast Notification -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <!-- App Shell -->
    <div class="app">

        <!-- Header -->
        <header class="app-header">
            <div class="header-inner">
                <span class="logo">₱ Track</span>
                <button class="history-btn" id="historyBtn" aria-label="Transaction History">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                        <path d="M12 7v5l4 2" />
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-scroll">

            <!-- Total Balance Card -->
            <section class="balance-card" id="balanceCard" role="button" tabindex="0" aria-expanded="false"
                aria-label="Total balance, tap to expand by bank">
                <div class="balance-top">
                    <p class="balance-label">Total Balance</p>
                    <span class="chevron" id="chevron">▼</span>
                </div>
                <h1 class="balance-amount" id="totalBalance">₱0.00</h1>
                <p class="balance-sub">Tap to see breakdown by bank</p>

                <!-- Bank Breakdown (collapsible) -->
                <div class="bank-breakdown" id="bankBreakdown">
                    <div class="bank-row" data-bank="gcash">
                        <div class="bank-info">
                            <span class="bank-dot gcash-dot"></span>
                            <span class="bank-name">GCash</span>
                        </div>
                        <span class="bank-balance" id="bal-gcash">₱0.00</span>
                    </div>
                    <div class="bank-row" data-bank="gotyme">
                        <div class="bank-info">
                            <span class="bank-dot gotyme-dot"></span>
                            <span class="bank-name">GoTyme</span>
                        </div>
                        <span class="bank-balance" id="bal-gotyme">₱0.00</span>
                    </div>
                    <div class="bank-row" data-bank="maribank">
                        <div class="bank-info">
                            <span class="bank-dot maribank-dot"></span>
                            <span class="bank-name">Maribank</span>
                        </div>
                        <span class="bank-balance" id="bal-maribank">₱0.00</span>
                    </div>
                    <div class="bank-row" data-bank="landbank">
                        <div class="bank-info">
                            <span class="bank-dot landbank-dot"></span>
                            <span class="bank-name">Landbank</span>
                        </div>
                        <span class="bank-balance" id="bal-landbank">₱0.00</span>
                    </div>
                </div>
            </section>

            <!-- Action Cards -->
            <div class="action-grid">

                <!-- Deposit Card -->
                <section class="action-card deposit-card">
                    <div class="action-card-header">
                        <span class="action-icon deposit-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <polyline points="19 12 12 19 5 12" />
                            </svg>
                        </span>
                        <h2 class="action-title">Deposit</h2>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="depositAmount">Amount</label>
                        <div class="amount-input-wrap">
                            <span class="currency-prefix">₱</span>
                            <input id="depositAmount" type="number" inputmode="decimal" placeholder="0.00" min="0"
                                step="0.01" class="amount-input" autocomplete="off" />
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Bank</label>
                        <div class="bank-pills" id="depositBankPills">
                            <button class="pill" data-bank="gcash" data-group="deposit">GCash</button>
                            <button class="pill" data-bank="gotyme" data-group="deposit">GoTyme</button>
                            <button class="pill" data-bank="maribank" data-group="deposit">Maribank</button>
                            <button class="pill" data-bank="landbank" data-group="deposit">Landbank</button>
                        </div>
                    </div>

                    <button class="action-btn deposit-btn" id="depositBtn">Deposit Money</button>
                </section>

                <!-- Spend Card -->
                <section class="action-card spend-card">
                    <div class="action-card-header">
                        <span class="action-icon spend-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="5" />
                                <polyline points="5 12 12 5 19 12" />
                            </svg>
                        </span>
                        <h2 class="action-title">Spend</h2>
                    </div>

                    <div class="input-group">
                        <label class="input-label" for="spendAmount">Amount</label>
                        <div class="amount-input-wrap">
                            <span class="currency-prefix">₱</span>
                            <input id="spendAmount" type="number" inputmode="decimal" placeholder="0.00" min="0"
                                step="0.01" class="amount-input" autocomplete="off" />
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Bank</label>
                        <div class="bank-pills" id="spendBankPills">
                            <button class="pill" data-bank="gcash" data-group="spend">GCash</button>
                            <button class="pill" data-bank="gotyme" data-group="spend">GoTyme</button>
                            <button class="pill" data-bank="maribank" data-group="spend">Maribank</button>
                            <button class="pill" data-bank="landbank" data-group="spend">Landbank</button>
                        </div>
                    </div>

                    <button class="action-btn spend-btn" id="spendBtn">Spend Money</button>
                </section>

            </div><!-- end action-grid -->

        </main><!-- end main-scroll -->
    </div><!-- end app -->

    <!-- Transaction History Modal -->
    <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Transaction History</h2>
                <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
            </div>

            <!-- Bank Filter Tabs -->
            <div class="modal-tabs" id="modalTabs">
                <button class="tab active" data-filter="all">All</button>
                <button class="tab" data-filter="gcash">GCash</button>
                <button class="tab" data-filter="gotyme">GoTyme</button>
                <button class="tab" data-filter="maribank">Maribank</button>
                <button class="tab" data-filter="landbank">Landbank</button>
            </div>

            <div class="modal-body" id="modalBody">
                <p class="empty-state">No transactions yet.</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
